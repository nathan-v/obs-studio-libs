name: Qt 6
run-name: Qt ${{ inputs.qt_version }} for Windows and macOS
# Builds Qt with obs-deps' own recipe and build action (deps.qt/, the
# build-qt action) on the Windows and macOS runners, repacks each platform's
# result as <tool>-<version>-<platform>.tar.zst (zstd 9, scripts/libs.py),
# attaches it to the release qt6-<version>, and records it in
# assets/qt6/manifest.json. Linux (glibc 2.28) is built by obs-studio's
# build-aux/appimage/manylinux/ image and published with the same script.
on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: Qt version obs-deps builds at obs_deps_ref (checked)
        required: true
        default: 6.11.1
      obs_deps_ref:
        description: obs-rust/obs-deps commit whose deps.qt recipe to build
        required: true
        default: fc89a353445a59c735276489082e6d11f446c6e1
permissions:
  contents: read
concurrency:
  group: qt6-${{ inputs.qt_version }}
  cancel-in-progress: false
jobs:
  build:
    name: Qt ${{ inputs.qt_version }} (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            target: x64
            config: RelWithDebInfo
            platform: os=windows,arch=x86_64,libc=msvc
            variant: optimization=relwithdebinfo
            output: windows/*.zip
          - name: windows-arm64
            runner: windows-11-arm
            target: arm64
            config: RelWithDebInfo
            platform: os=windows,arch=aarch64,libc=msvc
            variant: optimization=relwithdebinfo
            output: windows/*.zip
          - name: macos-universal
            runner: macos-15
            target: macos-universal
            config: Release
            platform: os=darwin,arch=universal2,os_version=11.0
            variant: optimization=release
            output: macos-universal/*.tar.xz
    steps:
      # obs-deps at the workspace root: its build-qt action runs its scripts
      # from there. This repository goes into libs/ (after, since a checkout
      # into the root cleans it).
      - name: Checkout obs-deps
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: obs-rust/obs-deps
          ref: ${{ inputs.obs_deps_ref }}
          persist-credentials: false
      - name: Checkout obs-studio-libs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: libs
          persist-credentials: false
      - name: Check the recipe's Qt version
        shell: bash
        env:
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          grep -q "^local version=${QT_VERSION}\$" deps.qt/qt6.zsh ||
            { echo "::error::deps.qt/qt6.zsh at ${{ inputs.obs_deps_ref }} does not build Qt ${QT_VERSION}"; exit 1; }
          grep -q "Version = '${QT_VERSION}'" deps.qt/qt6.ps1 ||
            { echo "::error::deps.qt/qt6.ps1 at ${{ inputs.obs_deps_ref }} does not build Qt ${QT_VERSION}"; exit 1; }
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer
      - name: Build Qt
        uses: ./.github/actions/build-qt
        with:
          target: ${{ matrix.target }}
          config: ${{ matrix.config }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Repack as tar.zst
        shell: bash
        env:
          OUTPUT: ${{ matrix.output }}
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          shopt -s nullglob
          files=($OUTPUT)
          [ "${#files[@]}" = 1 ] || { echo "::error::expected one obs-deps archive for $OUTPUT, found: ${files[*]:-none}"; exit 1; }
          mkdir stage
          case "${files[0]}" in
          *.zip) unzip -q "${files[0]}" -d stage ;;
          *.tar.xz) tar -xJf "${files[0]}" -C stage ;;
          esac
          uv run --python 3.14 libs/scripts/libs.py pack stage --tool qt6 --version "$QT_VERSION" \
            --platform "$PLATFORM" --variant "$VARIANT" --out dist
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qt6-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Attach to the release and record in the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          QT_VERSION: ${{ inputs.qt_version }}
        run: |
          tag="qt6-${QT_VERSION}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --title "Qt ${QT_VERSION}" --notes "Qt ${QT_VERSION} per platform; see assets/qt6/manifest.json."
          gh release upload "$tag" dist/*.tar.zst --clobber
          uv run --python 3.14 scripts/libs.py add dist/*.tar.zst.json
          uvx --from git+https://github.com/zackees/manifest.json@e255ede6edf4a646a6d1031e91fd57136105a899 \
            manifest-validate manifest.json assets/*/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json assets
          git commit -m "qt6 ${QT_VERSION}: Windows and macOS assets"
          git push
