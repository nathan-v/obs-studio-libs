# Local producers under bosn (zackees/bosn).
#   bosn run --task linux    build every Linux tool (recipes/linux/Dockerfile) and
#                            pack each into dist/<tool>-<version>-linux-x86_64-glibc2.28-release.tar.zst
# then: obs-studio-libs add dist/*.tar.zst.json --assets <assets-branch checkout>,
# and upload the archives to the <tool>-<version> releases.

[stack.linux]
dockerfile = "recipes/linux/Dockerfile"
family = "obs-studio-libs-linux"
workdir = "/src"

[stack.linux.env]
UV_CACHE_DIR = "/tmp/uv-cache"

[stack.linux.mounts]
src = { source = ".", destination = "/src" }

[task.linux]
stack = "linux"
cmd = "recipes/linux/pack.sh"
